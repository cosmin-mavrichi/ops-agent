# Read-only identity for the ops agent. Apply once: kubectl apply -f deploy/k8s/ops-ro.yaml
# For each extra namespace the agent may inspect, copy the Role and RoleBinding with that namespace
# and add it to OPS_K8S_NAMESPACES.
#
# Deliberately absent: secrets, configmaps (often hold credentials), pods/exec, pods/portforward,
# and every write verb. The MCP server's pod must run as this ServiceAccount.
apiVersion: v1
kind: Namespace
metadata:
  name: ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-ro
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-ro
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # What changed (k8s_changes): rollouts from ReplicaSets, and Jobs such as migrations. Their pod templates hold
  # env like pods do; the tool reads only images, revision annotations and Job status.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # NetworkPolicies, also for k8s_changes: which traffic each one allows. They hold selectors, ports and IP ranges.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  # cert-manager status only. The issued keys stay in Secrets (not granted); CertificateRequests are left
  # out because the Certificate and Issuer status already say why issuance fails.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch"]
  # CloudNativePG backup status. Object store credentials stay in Secrets (not granted).
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-ro
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ops-ro
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-ro
